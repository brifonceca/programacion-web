<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bebidas enrgeticas</title>
</head>
<body>
    <header>
        <h1>Bebidas energeticas</h1>
        <p>Inice su pedido</p>
    </header>
    <main>
     <form>
         <section>
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" />
          <label for="direccion">Dirección</label>
          <input type="text" id="direccion" name="direccion" />
          <label for="email">Email</label>
          <input type="text" id="email" name="email" />
          <label for="telefono">Telefono</label>
          <input type="text" id="telefono" name="telefono" />
         </section>
         <section>
          <h3>Tamaño:</h3>
          <input type="radio" id="chica" name="tamaño" value="chica"/>
          <label for="chica">Chica</label>
          <input type="radio" id="mediana" name="tamaño" value="mediana"/>
          <label for="mediana">Mediana</label>
          <input type="radio" id="grande" name="tamaño" value="grande"/>
          <label for="grande">Grande</label>
         </section>
         <section>
          <h3>Tipos de bebidas</h3>
          <label for="monster">Monster</label>
          <input type="checkbox" id="monster" name="tipoMonster" value="monster"/>
          <label for="speed">Speed</label>
          <input type="checkbox" id="speed" name="tipoSpeed" value="speed"/>
          <label for="redbull">Red Bull</label>
          <input type="checkbox" id="redbull" name="tipoRedBull" value="redbull"/>
         </section>
         <section>
          <label for="temp">Temperatura</label>
          <select id="temp" name="temp">
          <option value="helada">Helada</option>
          <option value="fria">Fria</option>
         </select>
         <h2>Comentarios</h2>
        <textarea id="comentarios" name="comentarios" rows="4" cols="30"></textarea required>
        <button type="submit">Enviar pedido</button>    
     </form>
    </main>
</body>
</html>
